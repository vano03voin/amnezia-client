name: Windows VPN inclusion mode

on:
  push:
    branches: [windows-app-include]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driver:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Test application selection policy
        shell: cmd
        working-directory: drivers/windows-split-tunnel
        run: |
          cl /std:c++17 /W4 /WX /EHsc tests\policy.cpp /Fe:policy-tests.exe
          if errorlevel 1 exit /b 1
          policy-tests.exe
      - name: Restore WDK and matching SDK
        working-directory: drivers/windows-split-tunnel
        run: nuget restore packages.config -PackagesDirectory packages -NonInteractive
      - name: Compile kernel driver (unsigned, for isolated testing)
        shell: cmd
        working-directory: drivers/windows-split-tunnel/src
        run: msbuild mullvad-split-tunnel.sln /m /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /p:SpectreMitigation=false
      - uses: actions/upload-artifact@v4
        with:
          name: inclusion-driver-unsigned
          path: drivers/windows-split-tunnel/bin/x64-Release/mullvad-split-tunnel
          if-no-files-found: error

  client:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtremoteobjects qt5compat qtshadertools
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install conan==2.28.0
      - name: Configure client and regression tests
        run: cmake -S . -B deploy/build -DCMAKE_BUILD_TYPE=Release -DAMNEZIA_BUILD_TESTS=ON
      - name: Compile client, service and focused regression tests
        run: cmake --build deploy/build --config Release --target AmneziaVPN AmneziaVPN-service test_app_split_tunnel_ipc test_settings_signals test_ui_app_st_model_and_controller -- /m
      - name: Run regression tests
        shell: pwsh
        run: |
          $env:PATH = "$PWD/deploy/build/client/Release;$PWD/deploy/build/client/tests/Release;$env:QT_ROOT_DIR/bin;$env:PATH"
          $env:QT_QPA_PLATFORM = 'offscreen'
          ctest --test-dir deploy/build/client/tests -C Release -R 'AppSplitTunnelIpcTest|SettingsSignalsTest|UiAppSTModelAndControllerTest' --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: inclusion-client-build
          path: |
            deploy/build/client/Release
            deploy/build/service/server/Release
          if-no-files-found: error

